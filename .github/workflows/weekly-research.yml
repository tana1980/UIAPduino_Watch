name: Weekly research update

on:
  workflow_dispatch:
  schedule:
    # Sunday 20:17 JST (11:17 UTC)
    - cron: "17 11 * * 0"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: weekly-research
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Create isolated update branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/weekly-research-${GITHUB_RUN_ID}"
          git switch --create "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Run Gemini CLI
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        uses: google-github-actions/run-gemini-cli@v0.1.22
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Read AGENTS.md and README.md first. Perform this week's research update
            for UIAPduino Watch. Follow the repository's verification, duplicate-check,
            source-attribution, and privacy rules exactly. Update only the curated data,
            research log, and changelog files when a genuinely useful verified update
            exists. Do not publish, modify workflow files, expose secrets, or change
            repository settings. Run npm run validate, npm test, and npm run build.
            If there is no verified useful update, leave the working tree unchanged.

      - name: Create pull request only when changed
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes; no PR will be created."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs CHANGELOG.md
          git commit -m "chore: weekly research update"
          git push --set-upstream origin "$BRANCH"
          gh pr create --base main --head "$BRANCH"             --title "Weekly research update"             --body "Automated research proposal. Review sources, duplicates, validation output, and public-content safety before merging."